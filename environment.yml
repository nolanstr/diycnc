# Voxel FEA in analysis/ (stiffness, vibration modes, topology studies).
#   conda env create -f environment.yml && conda activate diycnc
# The model itself (model/, analysis/voxelize.py) runs in FreeCAD's own Python (freecadcmd).
name: diycnc
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy
  - scipy
  - matplotlib
  - scikit-sparse>=0.5
